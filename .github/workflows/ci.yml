name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same version as in the local environment, so formatting agrees.
      - run: pip install "ruff==0.17.3"
      - run: ruff check src tests app
      - run: ruff format --check src tests app

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Only the core dependencies: models, Chroma and Hugging Face are replaced
      # by fakes in the tests, so no torch and no network are needed.
      - run: pip install -e ".[dev]"
      - run: pytest
