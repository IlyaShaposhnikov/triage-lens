[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-lens"
version = "0.1.0"
description = "Automatic triage for GitHub issues: type classification and duplicate search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ilya Shaposhnikov" }]
dependencies = ["requests>=2.32", "numpy>=1.26", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]